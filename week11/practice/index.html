
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11 - React Practice</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            color: #222;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1, h2 {
            color: #245b91;
        }

        .greeting {
            background: #dceeff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }

        button {
            background: #245b91;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #163e68;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Week 11: React Practice</h1>
        <h2>Part 1: Your First Component</h2>

        <div id="root"></div>
    </div>

    <script type="text/babel">

        const { useState } = React;

        // Part 2: Props
        function ProfileCard({ name, role, followers, isVerified }) {
            return (
                <div className="greeting">
                    <h3>{name} {isVerified && "[Verified]"}</h3>
                    <p>{role}</p>
                    <p>{followers.toLocaleString()} followers</p>
                </div>
            );
        }

        // Part 3: Component Composition and props.children
        function Card({ title, children }) {
            return (
                <div className="greeting">
                    <h3>{title}</h3>
                    <div>{children}</div>
                </div>
            );
        }

        function StudentInfo() {
            return (
                <Card title="Student Info">
                    <p>Name: Roshani Sunar</p>
                    <p>Major: Computer Engineering</p>
                    <button>Edit Profile</button>
                </Card>
            );
        }

        // Part 4: Conditional Rendering
        function Alert({ type, message }) {
            if (!message) return null;

            return (
                <div className="greeting">
                    {type === "error" ? "ERROR:" : "OK:"} {message}
                </div>
            );
        }

        // Login and Logout Dashboard
        function Dashboard() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            return (
                <div className="greeting">
                    {isLoggedIn ? (
                        <div>
                            <h3>Welcome, Roshani!</h3>
                            <button onClick={() => setIsLoggedIn(false)}>
                                Logout
                            </button>
                        </div>
                    ) : (
                        <div>
                            <h3>Please log in.</h3>
                            <button onClick={() => setIsLoggedIn(true)}>
                                Login
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // Part 5: ProductCard Component
        function ProductCard({ name, price, rating, inStock }) {
            return (
                <div className="greeting">
                    <h3>{name}</h3>
                    <p>Price: ₩{price.toLocaleString()}</p>
                    <p>Rating: {rating} / 5 stars</p>
                    <p>{inStock ? "In Stock" : "Out of Stock"}</p>
                </div>
            );
        }

        // Main App Component
        function App() {
            return (
                <div>
                    <ProfileCard
                        name="Kim Minho"
                        role="Frontend Developer"
                        followers={1240}
                        isVerified={true}
                    />

                    <StudentInfo />

                    <h2>Part 4: Conditional Rendering</h2>

                    <Alert
                        type="success"
                        message="Your work was saved successfully!"
                    />

                    <Alert
                        type="error"
                        message="Something went wrong!"
                    />

                    <Dashboard />

                    <h2>Part 5: Product Gallery</h2>

                    <ProductCard
                        name="Wireless Earbuds"
                        price={89000}
                        rating={4.5}
                        inStock={true}
                    />

                    <ProductCard
                        name="School Backpack"
                        price={45000}
                        rating={4.2}
                        inStock={true}
                    />

                    <ProductCard
                        name="Mechanical Keyboard"
                        price={65000}
                        rating={4.8}
                        inStock={false}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>
</body>
</html>
