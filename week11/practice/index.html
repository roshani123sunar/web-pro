
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Week 11 - React Portfolio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
:root {
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #eaf4ff;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.section {
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 30px;
}

h1, h2, h3 {
    color: #245b91;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #52677f;
}

.greeting {
    background: #dceeff;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
}

button {
    background: #245b91;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #163e68;
}

button.active {
    background: #2879c7;
}

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.project-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.project-card {
    background: #fff;
    border: 1px solid #c7e0f8;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 3px 10px #174a7e12;
}

.project-card h2 {
    font-size: 20px;
}

.project-card p {
    line-height: 1.6;
    color: #52677f;
}

.tag {
    display: inline-block;
    background: #e5f2ff;
    color: #205b91;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 12px;
    margin: 3px;
}

.links {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid #e3edf7;
}

.links a {
    display: inline-block;
    color: #1765a5;
    font-weight: bold;
    font-size: 13px;
    margin: 5px 10px 5px 0;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

/* Student Directory */

.student-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

.student-card {
    background: #fff;
    width: 260px;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.1);
    border: 1px solid #c7e0f8;
}

.student-card h2 {
    color: #24527a;
    margin-top: 0;
}

.student-card p {
    line-height: 1.6;
}

/* Course Catalog */

.course-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.course-card {
    background: #fff;
    padding: 22px;
    border: 1px solid #c7e0f8;
    border-radius: 12px;
    box-shadow: 0 3px 10px #174a7e12;
}

.course-card h2 {
    color: #245b91;
    font-size: 20px;
    margin-top: 0;
}

.course-card p {
    line-height: 1.6;
    color: #52677f;
}

.course-info {
    border-top: 1px solid #e3edf7;
    padding-top: 10px;
    margin-top: 15px;
}

.course-level {
    display: inline-block;
    background: #e5f2ff;
    color: #205b91;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
}

/* React Practice */

.avatar {
    border-radius: 50%;
    display: block;
    margin-bottom: 8px;
}

.notifications {
    list-style: none;
    padding: 0;
    margin: 0;
}

.notifications li {
    background: #dceeff;
    padding: 10px 12px;
    margin: 8px 0;
    border-radius: 8px;
}

footer {
    text-align: center;
    margin-top: 30px;
    color: #52677f;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .section {
        padding: 18px;
    }

    .student-card {
        width: 100%;
    }
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState } = React;

/* ---------- PART 1: PORTFOLIO GALLERY ---------- */

const projects = [
    {
        title: "Interactive Color Palette",
        description: "An interactive color palette that allows users to explore different colors.",
        tech: ["JavaScript", "CSS"],
        live: "https://roshani123sunar.github.io/web-pro/Week%205/index.html",
        github: "https://github.com/roshani123sunar/web-pro/tree/main/Week%205"
    },
    {
        title: "Random Joke Fetcher",
        description: "A simple project that displays random jokes using JavaScript.",
        tech: ["JavaScript", "HTML"],
        live: "https://roshani123sunar.github.io/web-pro/Week%206/",
        github: "https://github.com/roshani123sunar/web-pro/tree/main/Week%206"
    },
    {
        title: "HTML Forms",
        description: "A form practice project with input fields and an organized layout.",
        tech: ["HTML", "CSS"],
        live: "https://roshani123sunar.github.io/web-pro/Week%207/",
        github: "https://github.com/roshani123sunar/web-pro/tree/main/Week%207"
    }
];

function FilterBar({ selectedTech, setSelectedTech }) {
    return (
        <div className="filters">
            {["All", "JavaScript", "HTML", "CSS"].map(t => (
                <button
                    key={t}
                    className={selectedTech === t ? "active" : ""}
                    onClick={() => setSelectedTech(t)}
                >
                    {t}
                </button>
            ))}
        </div>
    );
}

function ProjectCard({ project }) {
    return (
        <div className="project-card">
            <h2>{project.title}</h2>
            <p>{project.description}</p>

            <div>
                {project.tech.map(t => (
                    <span className="tag" key={t}>{t}</span>
                ))}
            </div>

            <div className="links">
                <a href={project.live} target="_blank" rel="noreferrer">Live Site ↗</a>
                <a href={project.github} target="_blank" rel="noreferrer">GitHub Repository ↗</a>
            </div>
        </div>
    );
}

function PortfolioGallery() {
    const [selectedTech, setSelectedTech] = useState("All");

    const filtered = selectedTech === "All"
        ? projects
        : projects.filter(p => p.tech.includes(selectedTech));

    return (
        <div className="section">
            <h1>Portfolio Gallery</h1>
            <p className="subtitle">My Web Programming Projects</p>

            <FilterBar
                selectedTech={selectedTech}
                setSelectedTech={setSelectedTech}
            />

            <div className="project-list">
                {filtered.map((p, i) => (
                    <ProjectCard key={i} project={p} />
                ))}
            </div>
        </div>
    );
}

/* ---------- PART 2: STUDENT DIRECTORY ---------- */

function StudentProfileCard({ name, studentId, major, year, university }) {
    return (
        <div className="student-card">
            <h2>{name}</h2>
            <p><strong>Student ID:</strong> {studentId}</p>
            <p><strong>Major:</strong> {major}</p>
            <p><strong>Year:</strong> {year}</p>
            <p><strong>University:</strong> {university}</p>
        </div>
    );
}

const students = [
    {
        name: "Sunar Roshani",
        studentId: "202537197",
        major: "Computer Engineering",
        year: "2nd Year",
        university: "Gachon University"
    },
    {
        name: "Aale Aaditi",
        studentId: "202537195",
        major: "Computer Engineering",
        year: "2nd Year",
        university: "Gachon University"
    },
    {
        name: "Shrestha Puja",
        studentId: "202537250",
        major: "Computer Engineering",
        year: "2nd Year",
        university: "Gachon University"
    }
];

function StudentDirectorySection() {
    return (
        <div className="section">
            <h1>Student Directory</h1>

            <p className="subtitle">
                A StudentProfileCard with five props, used for three students and styled with my own CSS.
            </p>

            <div className="student-container">
                {students.map((s, i) => (
                    <StudentProfileCard key={i} {...s} />
                ))}
            </div>

            <div className="links">
                <a href="https://github.com/roshani123sunar/web-pro/tree/main/week11"
                   target="_blank" rel="noreferrer">
                    Repository ↗
                </a>
            </div>
        </div>
    );
}

/* ---------- PART 3: COURSE CATALOG ---------- */

const courses = [
    {
        id: 1,
        title: "Web Programming",
        description: "Learn HTML, CSS, JavaScript and React.",
        instructor: "Professor Kim",
        credits: 3,
        level: "Beginner"
    },
    {
        id: 2,
        title: "Data Structures",
        description: "Learn arrays, linked lists, stacks and queues.",
        instructor: "Professor Lee",
        credits: 3,
        level: "Intermediate"
    },
    {
        id: 3,
        title: "Computer Networks",
        description: "Understand computer networks and communication.",
        instructor: "Professor Park",
        credits: 3,
        level: "Intermediate"
    }
];

function CourseCard({ course }) {
    return (
        <div className="course-card">
            <h2>{course.title}</h2>
            <p>{course.description}</p>

            <div className="course-info">
                <p><strong>Instructor:</strong> {course.instructor}</p>
                <p><strong>Credits:</strong> {course.credits}</p>
                <span className="course-level">{course.level}</span>
            </div>
        </div>
    );
}

function CourseCatalog() {
    return (
        <div className="section">
            <h1>Course Catalog</h1>

            <p className="subtitle">
                My Computer Engineering Courses
            </p>

            <div className="course-container">
                {courses.map(course => (
                    <CourseCard key={course.id} course={course} />
                ))}
            </div>
        </div>
    );
}

/* ---------- PART 4: REACT PRACTICE ---------- */

// E1: Greeting Component

function Greeting() {
    return <p className="greeting">Hello, World!</p>;
}

// E2: StudentCard

function StudentCard({ name, id, major }) {
    return (
        <div className="greeting">
            <h3>{name}</h3>
            <p>ID: {id}</p>
            <p>Major: {major}</p>
        </div>
    );
}

// E3: ProfileCard with default avatar

const DEFAULT_AVATAR =
    "data:image/svg+xml," +
    encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
        '<rect width="80" height="80" fill="#cfe3f7"/>' +
        '<circle cx="40" cy="31" r="14" fill="#245b91"/>' +
        '<path d="M12 80c2-18 14-28 28-28s26 10 28 28z" fill="#245b91"/></svg>'
    );

function ProfileCard({ name, role, email, avatarUrl = DEFAULT_AVATAR }) {
    return (
        <div className="greeting">
            <img className="avatar" src={avatarUrl} alt={name} width="80" height="80" />
            <h3>{name}</h3>
            <p>{role}</p>
            <a href={"mailto:" + email}>{email}</a>
        </div>
    );
}

function FollowerCard({ name, role, followers, isVerified }) {
    return (
        <div className="greeting">
            <h3>{name} {isVerified && "[Verified]"}</h3>
            <p>{role}</p>
            <p>{followers.toLocaleString()} followers</p>
        </div>
    );
}

// E4: Notification List

const notifications = [
    { id: 1, type: "success", message: "Profile updated successfully" },
    { id: 2, type: "warning", message: "Password expires in 3 days" },
    { id: 3, type: "info", message: "New lecture materials available" }
];

function NotificationItem({ type, message }) {
    const icon = type === "success"
        ? "✅"
        : type === "warning"
        ? "⚠️"
        : "ℹ️";

    return <li>{icon} {message}</li>;
}

function NotificationList() {
    return (
        <ul className="notifications">
            {notifications.map(n => (
                <NotificationItem
                    key={n.id}
                    type={n.type}
                    message={n.message}
                />
            ))}
        </ul>
    );
}

// E5: Card with children

function Card({ title, children }) {
    return (
        <div className="greeting">
            <h3>{title}</h3>
            <div>{children}</div>
        </div>
    );
}

function StudentInfo() {
    return (
        <Card title="Student Info">
            <p>Name: Roshani Sunar</p>
            <p>Major: Computer Engineering</p>
            <button>Edit Profile</button>
        </Card>
    );
}

// E7: Student List

const gradeList = [
    { id: 1, name: "Lee Jungwoo", grade: "A" },
    { id: 2, name: "Park Sohee", grade: "B+" },
    { id: 3, name: "Kim Minho", grade: "A-" }
];

function StudentList() {
    return (
        <ul className="notifications">
            {gradeList.map(s => (
                <li key={s.id}>{s.name} -- {s.grade}</li>
            ))}
        </ul>
    );
}

// E8: Alert and Dashboard

function Alert({ type, message }) {
    if (!message) return null;

    return (
        <div className="greeting">
            {type === "error" ? "ERROR:" : "OK:"} {message}
        </div>
    );
}

function Dashboard() {
    const [isLoggedIn, setIsLoggedIn] = useState(false);

    return (
        <div className="greeting">
            {isLoggedIn ? (
                <div>
                    <h3>Welcome, Roshani!</h3>
                    <button onClick={() => setIsLoggedIn(false)}>Logout</button>
                </div>
            ) : (
                <div>
                    <h3>Please log in.</h3>
                    <button onClick={() => setIsLoggedIn(true)}>Login</button>
                </div>
            )}
        </div>
    );
}

// E6: Product Card

function ProductCard({ name, price, rating, inStock }) {
    return (
        <div className="greeting">
            <h3>{name}</h3>
            <p>Price: ₩{price.toLocaleString()}</p>
            <p>Rating: {rating} / 5 stars</p>
            <p>{inStock ? "In Stock" : "Out of Stock"}</p>
        </div>
    );
}

// React Practice Section

function PracticeSection() {
    return (
        <div className="section">
            <h1>React Practice</h1>

            <h2>E1: Your First Component</h2>
            <Greeting />
            <Greeting />
            <Greeting />

            <h2>E2: StudentCard</h2>
            <StudentCard name="Lama Srijan" id="STUDENT_ID" major="Computer Engineering" />
            <StudentCard name="Roshani Sunar" id="202537197" major="Computer Engineering" />

            <h2>E3: ProfileCard with a default prop</h2>
            <ProfileCard name="Dr. Toshpulatov" role="Professor" email="muhiddin@gachon.ac.kr" />
            <ProfileCard name="Sunar Roshani" role="Computer Engineering Student" email="roshani123sunar0@gmail.com" />

            <h2>E4: List of Notifications</h2>
            <NotificationList />

            <h2>E5: Layout with props.children</h2>
            <StudentInfo />
            <Card title="Lecture Topics">
                <ul>
                    <li>Components</li>
                    <li>Props</li>
                </ul>
            </Card>

            <h2>E6: ProductCard</h2>
            <ProductCard name="Wireless Earbuds" price={89000} rating={4.5} inStock={true} />
            <ProductCard name="School Backpack" price={45000} rating={4.2} inStock={true} />
            <ProductCard name="Mechanical Keyboard" price={65000} rating={4.8} inStock={false} />

            <h2>E7: Rendering a list with keys</h2>
            <StudentList />

            <h2>E8: Conditional Rendering</h2>
            <Alert type="success" message="Your work was saved successfully!" />
            <Alert type="error" message="Something went wrong!" />
            <Dashboard />
        </div>
    );
}

/* ---------- MAIN APP ---------- */

function App() {
    return (
        <div className="container">
            <PortfolioGallery />
            <StudentDirectorySection />
            <CourseCatalog />
            <PracticeSection />

            <footer>
                Web Programming | Roshani Sunar | Gachon University
            </footer>
        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>
</body>
</html>
