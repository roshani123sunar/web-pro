
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog - Roshani</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            color: #222;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 14px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #d5e5fa;
        }

        header h1 {
            color: #2455a4;
            margin: 0 0 10px;
        }

        header p {
            color: #555;
            margin: 0;
        }

        .section-title {
            color: #2455a4;
            margin: 25px 0 15px;
        }

        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: white;
            padding: 24px;
            border: 1px solid #d5e5fa;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(40, 80, 130, 0.08);
            transition: transform 0.2s;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .course-card h2 {
            color: #2455a4;
            font-size: 21px;
            margin-top: 0;
        }

        .course-card p {
            line-height: 1.6;
            color: #333;
        }

        .course-info {
            border-top: 1px solid #e1eaf6;
            padding-top: 12px;
            margin-top: 15px;
        }

        .level {
            display: inline-block;
            background: #e4efff;
            color: #2455a4;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            padding: 20px;
            color: #555;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 12px;
            }

            header {
                padding: 22px 15px;
            }
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        const courses = [
            {
                id: 1,
                title: "Web Programming",
                instructor: "Professor Kim",
                credits: 3,
                level: "Beginner",
                description: "Learn HTML, CSS, JavaScript and React."
            },
            {
                id: 2,
                title: "Data Structures",
                instructor: "Professor Lee",
                credits: 3,
                level: "Intermediate",
                description: "Learn arrays, linked lists, stacks and queues."
            },
            {
                id: 3,
                title: "Computer Networks",
                instructor: "Professor Park",
                credits: 3,
                level: "Intermediate",
                description: "Understand computer networks and communication."
            }
        ];

        function CourseCard({ course }) {
            return (
                <div className="course-card">
                    <h2>{course.title}</h2>

                    <p>{course.description}</p>

                    <div className="course-info">
                        <p><strong>Instructor:</strong> {course.instructor}</p>
                        <p><strong>Credits:</strong> {course.credits}</p>
                        <span className="level">{course.level}</span>
                    </div>
                </div>
            );
        }

        function CourseList() {
            return (
                <div className="container">

                    <header>
                        <h1>Course Catalog</h1>
                        <p>My Computer Engineering Courses</p>
                    </header>

                    <h2 className="section-title">Available Courses</h2>

                    <div className="course-container">
                        {courses.map(course => (
                            <CourseCard
                                key={course.id}
                                course={course}
                            />
                        ))}
                    </div>

                    <footer>
                        Web Programming | Roshani Sunar
                    </footer>

                </div>
            );
        }

        function App() {
            return <CourseList />;
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>
</html>
