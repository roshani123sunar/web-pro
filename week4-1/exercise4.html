<!DOCTYPE html>
<html>
<head>
  <title>Live Student Search</title>

  <style>
    h2 {
      color: #1a56db;
    }

    #search {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 2px solid #1a56db;
      border-radius: 10px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }

    .student {
      padding: 10px 14px;
      margin-bottom: 6px;
      background: #f0f4ff;
      border-radius: 8px;
      border: 1px solid #c8d4f0;
      font-size: 15px;
    }

    #no-results {
      display: none;
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body style="
  font-family:system-ui;
  padding:20px;
  max-width:420px;
  margin:auto">

  <h2>Find a Student</h2>

  <input
    id="search"
    type="text"
    placeholder="Type a name to search..."
  >

  <div id="student-list">

    <div class="student" data-name="Roshani Sunar">
      Roshani Sunar — Computer Engineering
    </div>

    <div class="student" data-name="Anisha Sharma">
      Anisha Sharma — Information Technology
    </div>

    <div class="student" data-name="Sujan Thapa">
      Sujan Thapa — Software Engineering
    </div>

    <div class="student" data-name="Mina Gurung">
      Mina Gurung — Data Science
    </div>

    <div class="student" data-name="Aarav Karki">
      Aarav Karki — Artificial Intelligence
    </div>

    <div class="student" data-name="Sita Rai">
      Sita Rai — Computer Science
    </div>

  </div>

  <p id="no-results">
    No matching students found.
  </p>

  <script>
    const searchInp = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    searchInp.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();

      let visible = 0;

      students.forEach(student => {
        const name = student.dataset.name.toLowerCase();

        if (name.includes(term)) {
          student.style.display = '';
          visible++;
        } else {
          student.style.display = 'none';
        }
      });

      noResults.style.display =
        visible === 0 ? 'block' : 'none';
    });
  </script>

</body>
</html>
