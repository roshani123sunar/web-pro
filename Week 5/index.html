
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Palette</title>

    <style>
        /* CSS will be added in Part 2 */
    </style>
</head>
<body>

    <header>
        <h1>Interactive Color Palette</h1>
        <p>Create, explore, and save your favorite colors!</p>
    </header>

    <main>
        <section class="controls">
            <h2>My Color Palette</h2>

            <div class="add-color">
                <label for="colorPicker">Choose a color:</label>
                <input type="color" id="colorPicker" value="#A7C7E7">
                <button id="addColorBtn">Add Color</button>
            </div>

            <p class="instructions">
                Click a color to expand it. Double-click a color to remove it.
            </p>
        </section>

        <section id="palette" class="palette">
            <!-- Starting colors will be added in Part 4 -->
        </section>

        <section class="actions">
            <button id="saveBtn">Save Palette</button>
            <button id="restoreBtn">Restore Palette</button>
            <button id="exportBtn">Export as PNG</button>
        </section>

        <p id="message" role="status"></p>
    </main>

    <footer>
        <p>Interactive Color Palette | Web Programming</p>
    </footer>

    <script>
        // JavaScript will be added in Parts 3 and 4
    </script>

</body>
</html>
