
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6 - Random Joke Fetcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAF3FF;
            color: #000000;
        }

        header {
            background-color: #B7D7F5;
            text-align: center;
            padding: 30px 15px;
            border-bottom: 4px solid #78A9DD;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
        }

        .joke-box {
            background-color: #FFFFFF;
            border: 2px solid #B7D7F5;
            border-radius: 12px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .joke-box h2 {
            margin-top: 0;
            color: #245580;
        }

        #setup {
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0 15px;
        }

        #punchline {
            font-size: 18px;
            margin-bottom: 25px;
            color: #245580;
        }

        button {
            background-color: #4A90D9;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 13px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2869A8;
        }

        button:disabled {
            background-color: #9CBAD8;
            cursor: wait;
        }

        #message {
            margin-top: 20px;
            font-size: 15px;
            color: #555555;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #444444;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            header h1 {
                font-size: 26px;
            }

            .joke-box {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Random Joke Fetcher</h1>
        <p>Take a break and enjoy a random joke!</p>
    </header>

    <main class="container">
        <section class="joke-box">
            <h2>Ready for a Laugh?</h2>

            <p id="setup">
                Click the button to get a random joke!
            </p>

            <p id="punchline"></p>

            <button id="jokeButton" onclick="loadJoke()">
                Get a Random Joke
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>Week 6 Assignment | Random Joke Fetcher</p>
    </footer>

    <script>
        const jokeButton = document.getElementById("jokeButton");
        const setup = document.getElementById("setup");
        const punchline = document.getElementById("punchline");
        const message = document.getElementById("message");

        const backupJokes = [
            {
                setup: "Why don't scientists trust atoms?",
                punchline: "Because they make up everything!"
            },
            {
                setup: "Why did the computer go to the doctor?",
                punchline: "Because it had a virus!"
            },
            {
                setup: "Why was the math book sad?",
                punchline: "Because it had too many problems!"
            },
            {
                setup: "What do you call a sleeping dinosaur?",
                punchline: "A dino-snore!"
            },
            {
                setup: "Why did the student eat his homework?",
                punchline: "Because the teacher said it was a piece of cake!"
            }
        ];

        async function loadJoke() {
            jokeButton.disabled = true;
            jokeButton.textContent = "Loading...";
            setup.textContent = "Getting a joke for you...";
            punchline.textContent = "";
            message.textContent = "";

            try {
                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                if (!response.ok) {
                    throw new Error("Could not load a joke.");
                }

                const joke = await response.json();

                if (!joke.setup || !joke.punchline) {
                    throw new Error("Invalid joke data.");
                }

                setup.textContent = joke.setup;
                punchline.textContent = joke.punchline;

            } catch (error) {
                // Show a built-in joke if the API is unavailable.
                const randomIndex = Math.floor(
                    Math.random() * backupJokes.length
                );

                const joke = backupJokes[randomIndex];

                setup.textContent = joke.setup;
                punchline.textContent = joke.punchline;
                message.textContent =
                    "Showing a joke from our collection.";
            } finally {
                jokeButton.disabled = false;
                jokeButton.textContent = "Get a Random Joke";
            }
        }
    </script>

</body>
</html>
