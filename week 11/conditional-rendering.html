```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 - Conditional Rendering</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #172b4d;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    header {
      background: #d9eaff;
      border: 1px solid #b7d5f5;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #24558a;
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #405a78;
    }

    .section {
      max-width: 650px;
      margin: 20px auto;
      padding: 22px;
      background: #eaf4ff;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
    }

    .section-title {
      color: #24558a;
      margin: 0 0 18px;
      font-size: 21px;
    }

    .alert {
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-weight: bold;
      background: white;
    }

    .alert-error {
      color: #bd4040;
      border: 1px solid #f5caca;
    }

    .alert-success {
      color: #25804e;
      border: 1px solid #c5e8d3;
    }

    .dashboard {
      background: white;
      border: 1px solid #c8ddf5;
      border-radius: 10px;
      padding: 20px;
    }

    .dashboard p {
      margin: 0 0 15px;
      font-size: 17px;
    }

    .dashboard button {
      background: #24558a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
    }

    .dashboard button:hover {
      background: #193f69;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #60758e;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 15px;
      }

      header {
        padding: 24px 15px;
      }

      header h1 {
        font-size: 23px;
      }

      .section {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Week 11 - Conditional Rendering</h1>
      <p>Web Programming | null, ternary and &amp;&amp;</p>
    </header>

    <div id="root"></div>

    <footer>
      Web Programming | Roshani Sunar | Gachon University
    </footer>

  </div>

  <script type="text/babel">

    function Alert({ type, message }) {
      if (!message) return null;

      return (
        <div className={"alert alert-" + type}>
          {type === "error" ? "ERROR:" : "OK:"} {message}
        </div>
      );
    }

    function Dashboard({ user }) {
      return (
        <div className="dashboard">
          {user && <p>Welcome, {user.name}!</p>}
          {!user && <p>Please log in.</p>}
          {!user && <button>Log in</button>}
        </div>
      );
    }

    function App() {
      const loggedInUser = { name: "Roshani" };

      return (
        <div>

          <div className="section">
            <h2 className="section-title">Alert component</h2>

            <Alert type="error" message="You are not logged in." />
            <Alert type="success" message="Profile saved." />
            <Alert type="error" message="" />
          </div>

          <div className="section">
            <h2 className="section-title">
              Dashboard: user = null
            </h2>

            <Dashboard user={null} />
          </div>

          <div className="section">
            <h2 className="section-title">
              Dashboard: user logged in
            </h2>

            <Dashboard user={loggedInUser} />
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);

  </script>

</body>
</html>
