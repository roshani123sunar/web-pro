<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 - Profile Card</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #172b4d;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    header {
      background: #d9eaff;
      border: 1px solid #b7d5f5;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #24558a;
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #405a78;
    }

    .section {
      background: #eaf4ff;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      padding: 30px 20px;
      margin: 20px auto;
    }

    .section-title {
      color: #24558a;
      text-align: center;
      margin: 0 0 25px;
      font-size: 21px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
    }

    .profile-card {
      background: white;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(36, 85, 138, 0.08);
      padding: 28px 24px;
      width: 290px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #c8ddf5;
      object-fit: cover;
      object-position: 40% 90%;
      background: #ddd3bf;
      margin-bottom: 14px;
    }

    .profile-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #24558a;
    }

    .profile-card p {
      margin: 0 0 12px;
      color: #405a78;
      font-size: 16px;
    }

    .profile-card a {
      color: #24558a;
      font-size: 15px;
      word-break: break-all;
      text-decoration: none;
    }

    .profile-card a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #60758e;
      font-size: 14px;

    @media (max-width: 600px) {
      body {
        padding: 25px 15px;

      header {
        padding: 24px 15px;
      }

      header h1 {
        font-size: 23px;
      }

      .section {
        padding: 22px 15px;
      }

      .profile-card {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Week 11 - Profile Card</h1>
      <p>Web Programming | Props with a default value</p>
    </header>

    <div id="root"></div>

    <footer>
      Web Programming | Roshani Sunar | Gachon University
    </footer>

  </div>

  <script type="text/babel">

    const DEFAULT_AVATAR =
      "data:image/svg+xml," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
        '<rect width="80" height="80" fill="#ddd3bf"/>' +
        '<circle cx="40" cy="31" r="14" fill="#5c564a"/>' +
        '<path d="M12 80c0-18 14-28 28-28s28 10 28 28z" fill="#5c564a"/>' +
        '</svg>'
      );

    function ProfileCard({ name, role, email, avatarUrl = DEFAULT_AVATAR }) {
      return (
        <div className="profile-card">
          <img
            className="avatar"
            src={avatarUrl}
            alt={name}
            onError={(e) => { e.target.src = DEFAULT_AVATAR; }}
          />

          <h3>{name}</h3>
          <p>{role}</p>
          <a href={`mailto:${email}`}>{email}</a>
        </div>
      );
    }

    function App() {
      return (
        <div className="section">

          <h2 className="section-title">
            Profile Cards
          </h2>

          <div className="row">

            <ProfileCard
              name="Dr. Toshpulatov"
              role="Professor"
              email="muhiddin@gachon.ac.kr"
            />

            <ProfileCard
              name="Sunar Roshani"
              role="Computer Engineering student"
              email="roshni123sunar0@gmail.com"
              avatarUrl="roshani.jpg"
            />

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);

  </script>

</body>
</html>
