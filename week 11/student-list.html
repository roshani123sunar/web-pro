
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 - Student List</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #172b4d;
      padding: 40px 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    header {
      background: #d9eaff;
      border: 1px solid #b7d5f5;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #24558a;
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #405a78;
    }

    .section-title {
      color: #24558a;
      margin-bottom: 20px;
    }

    .student-list {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      max-width: 550px;
      background: white;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(36, 85, 138, 0.08);
      overflow: hidden;
    }

    .student-list li {
      padding: 20px 22px;
      border-bottom: 1px solid #e1ecf9;
      font-size: 16px;
      line-height: 1.8;
    }

    .student-list li:last-child {
      border-bottom: none;
    }

    .student-name {
      color: #24558a;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .student-info {
      color: #405a78;
    }

    .student-info strong {
      color: #172b4d;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #60758e;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Week 11 - Student List</h1>
      <p>Web Programming | Rendering Lists with .map()</p>
    </header>

    <h2 class="section-title">Students</h2>

    <div id="root"></div>

    <footer>
      Web Programming | Roshani Sunar | Gachon University
    </footer>

  </div>

  <script type="text/babel">

    const students = [
      {
        id: 1,
        name: "Sunar Roshani",
        studentNumber: "202537197",
        major: "Computer Engineering",
        year: "2nd Year"
      },
      {
        id: 2,
        name: "Aale Aaditi",
        studentNumber: "202537195",
        major: "Computer Engineering",
        year: "2nd Year"
      },
      {
        id: 3,
        name: "Shrestha Puja",
        studentNumber: "202537250",
        major: "Computer Engineering",
        year: "2nd Year"
      }
    ];

    function StudentList() {
      return (
        <ul className="student-list">
          {students.map(student => (
            <li key={student.id}>

              <div className="student-name">
                {student.name}
              </div>

              <div className="student-info">
                <strong>Student Number:</strong> {student.studentNumber}
                <br />

                <strong>Major:</strong> {student.major}
                <br />

                <strong>Year:</strong> {student.year}
              </div>

            </li>
          ))}
        </ul>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<StudentList />);

  </script>

</body>
</html>
