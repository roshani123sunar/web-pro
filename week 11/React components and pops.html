
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 - React Components & Props</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #172b4d;
      padding: 40px 20px;
    }

    .container { max-width: 950px; margin: auto; }

    header {
      background: #d9eaff;
      border: 1px solid #b7d5f5;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 { color: #24558a; margin: 0 0 10px; font-size: 28px; }
    header p { margin: 0; color: #405a78; }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    nav a {
      background: white;
      border: 1px solid #c8ddf5;
      border-radius: 20px;
      padding: 8px 16px;
      color: #24558a;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover { background: #d9eaff; }

    section {
      background: white;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 4px 12px rgba(36, 85, 138, 0.08);
    }

    section h2 { color: #24558a; margin: 0 0 6px; font-size: 22px; }

    .desc {
      margin: 0 0 20px;
      color: #60758e;
      font-size: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .simple-card, .product-card, .profile-simple,
    .info-card, .user-card, .profile-card,
    .student-card, .notification-card {
      background: #f7fbff;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      padding: 20px;
    }

    .simple-card {
      width: 220px;
      text-align: center;
    }

    .simple-card h3 { color: #24558a; margin: 0 0 8px; }

    .student-card {
      width: 260px;
      line-height: 1.8;
    }

    .student-card h3 { color: #24558a; margin: 0 0 10px; }
    .student-card p { margin: 4px 0; }

    .product-card {
      width: 260px;
      text-align: center;
    }

    .product-card h3 { color: #24558a; font-size: 20px; margin: 0 0 10px; }
    .price { font-size: 22px; font-weight: bold; margin: 0 0 8px; }
    .rating { color: #b7791f; margin: 0 0 10px; }

    .in-stock, .out-of-stock {
      font-weight: bold;
      padding: 9px;
      border-radius: 8px;
      margin: 0;
    }

    .in-stock { color: #25804e; background: #e4f5eb; }
    .out-of-stock { color: #bd4040; background: #fdeaea; }

    .student-list, .notification-list {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      max-width: 600px;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      overflow: hidden;
    }

    .student-list li, .notification-list li {
      padding: 18px 22px;
      border-bottom: 1px solid #e1ecf9;
      line-height: 1.8;
    }

    .student-list li:last-child,
    .notification-list li:last-child { border-bottom: none; }

    .student-name { color: #24558a; font-size: 19px; font-weight: bold; }
    .student-info { color: #405a78; }
    .student-info strong { color: #172b4d; }

    .notification-card {
      display: flex;
      gap: 14px;
      align-items: center;
      border: none;
      border-radius: 0;
      padding: 0;
      background: transparent;
    }

    .notification-icon { font-size: 25px; }
    .notification-card strong { color: #24558a; }

    .alert {
      max-width: 400px;
      margin: 0 auto 12px;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: bold;
    }

    .alert-error { color: #bd4040; background: #fdeaea; }
    .alert-success { color: #25804e; background: #e4f5eb; }

    .dashboard {
      max-width: 400px;
      margin: 0 auto;
      background: #f7fbff;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
    }

    .dashboard p { margin: 0 0 14px; font-size: 18px; }

    button.btn {
      background: #24558a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    button.btn:hover { background: #1d4670; }

    .profile-simple { width: 260px; }
    .profile-simple h3 { color: #24558a; margin: 0 0 8px; }
    .profile-simple p { margin: 0 0 6px; color: #405a78; }

    .info-card {
      width: 280px;
      padding: 0;
      overflow: hidden;
    }

    .info-title {
      margin: 0;
      padding: 14px 20px;
      color: #24558a;
      border-bottom: 1px solid #e1ecf9;
    }

    .info-body { padding: 14px 20px; }
    .info-body p { margin: 0 0 8px; color: #405a78; }

    .user-card {
      width: 220px;
      text-align: center;
    }

    .initials {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #24558a;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    .user-card h3 { margin: 0 0 6px; font-size: 17px; }
    .user-card p { margin: 0 0 4px; color: #405a78; font-size: 14px; }

    .profile-card {
      background: white;
      border: 2px solid #172b4d;
      border-radius: 18px;
      box-shadow: 6px 6px 0 #24558a;
      padding: 26px 22px;
      width: 280px;
      text-align: center;
    }

    .avatar-img {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid #172b4d;
      object-fit: cover;
      background: #ddd3bf;
      display: block;
      margin: 0 auto 14px;
    }

    .profile-card h3 { margin: 0 0 6px; font-size: 22px; }
    .profile-card p { margin: 0 0 10px; color: #405a78; font-size: 17px; }
    .profile-card a { color: #24558a; font-size: 15px; word-break: break-all; }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #60758e;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body { padding: 20px 14px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>Week 11 - React Components & Props</h1>
      <p>Web Programming | Practice Tasks</p>
    </header>

    <div id="root"></div>

    <footer>
      Web Programming | Roshani Sunar | Gachon University
    </footer>

  </div>

  <script type="text/babel">

    const { useState } = React;

    const DEFAULT_AVATAR =
      "data:image/svg+xml," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
        '<rect width="80" height="80" fill="#ddd3bf"/>' +
        '<circle cx="40" cy="31" r="14" fill="#5c564a"/>' +
        '<path d="M12 80c0-18 14-28 28-28s28 10 28 28z" fill="#5c564a"/>' +
        '</svg>'
      );

    const students = [
      {
        id: 1,
        name: "Sunar Roshani",
        studentNumber: "202537197",
        major: "Computer Engineering",
        year: "2nd Year",
        grade: "A"
      },
      {
        id: 2,
        name: "Aale Aaditi",
        studentNumber: "202537195",
        major: "Computer Engineering",
        year: "2nd Year",
        grade: "B+"
      },
      {
        id: 3,
        name: "Shrestha Puja",
        studentNumber: "202537250",
        major: "Computer Engineering",
        year: "2nd Year",
        grade: "A-"
      }
    ];

    const notifications = [
      { id: 1, type: "success", message: "Your assignment was submitted successfully." },
      { id: 2, type: "warning", message: "Your upcoming exam is next week." },
      { id: 3, type: "info", message: "A new React lesson is available." }
    ];

    // 1. First Component
    function WelcomeCard({ message }) {
      return (
        <div className="simple-card">
          <h3>Welcome!</h3>
          <p>{message}</p>
        </div>
      );
    }

    // 2. StudentCard with props
    function StudentCard({ name, id, major }) {
      return (
        <div className="student-card">
          <h3>{name}</h3>
          <p><strong>Student ID:</strong> {id}</p>
          <p><strong>Major:</strong> {major}</p>
        </div>
      );
    }

    // 3. ProductCard
    function ProductCard({ name, price, rating, inStock }) {
      return (
        <div className="product-card">
          <h3>{name}</h3>
          <p className="price">{price.toLocaleString()}원</p>
          <p className="rating">★ {rating} / 5 stars</p>
          <p className={inStock ? "in-stock" : "out-of-stock"}>
            {inStock ? "In Stock" : "Out of Stock"}
          </p>
        </div>
      );
    }

    // 4. Student List with map and key
    function StudentList() {
      return (
        <ul className="student-list">
          {students.map(student => (
            <li key={student.id}>
              <div className="student-name">{student.name}</div>
              <div className="student-info">
                <strong>Student Number:</strong> {student.studentNumber}<br />
                <strong>Major:</strong> {student.major}<br />
                <strong>Year:</strong> {student.year}<br />
                <strong>Grade:</strong> {student.grade}
              </div>
            </li>
          ))}
        </ul>
      );
    }

    // 5. Notifications with map and conditional icons
    function NotificationList() {
      return (
        <ul className="notification-list">
          {notifications.map(notification => (
            <li key={notification.id}>
              <div className="notification-card">
                <span className="notification-icon">
                  {notification.type === "success" ? "✅" :
                   notification.type === "warning" ? "⚠️" : "ℹ️"}
                </span>
                <div>
                  <strong>{notification.type.toUpperCase()}</strong>
                  <div>{notification.message}</div>
                </div>
              </div>
            </li>
          ))}
        </ul>
      );
    }

    // 6. Conditional Rendering
    function Alert({ type, message }) {
      if (!message) return null;

      return (
        <div className={"alert alert-" + type}>
          {type === "error" ? "ERROR:" : "OK:"} {message}
        </div>
      );
    }

    function Dashboard({ user, onLogin, onLogout }) {
      return (
        <div className="dashboard">
          {user && <p>Welcome, {user.name}!</p>}
          {!user && <p>Please log in.</p>}

          {!user && (
            <button className="btn" onClick={onLogin}>
              Log in
            </button>
          )}

          {user && (
            <button className="btn" onClick={onLogout}>
              Log out
            </button>
          )}
        </div>
      );
    }

    function ConditionalDemo() {
      const [user, setUser] = useState(null);

      return (
        <div>
          <Alert
            type="error"
            message={user ? "" : "You are not logged in."}
          />

          <Alert
            type="success"
            message={user ? "You are logged in." : ""}
          />

          <Dashboard
            user={user}
            onLogin={() => setUser({ name: "Roshani" })}
            onLogout={() => setUser(null)}
          />
        </div>
      );
    }

    // 7. Profile Badge
    function ProfileBadge({ name, role, followers, isVerified }) {
      return (
        <div className="profile-simple">
          <h3>{name} {isVerified && "[Verified]"}</h3>
          <p>{role}</p>
          <p>{followers.toLocaleString()} followers</p>
        </div>
      );
    }

    // 8. Card with props.children
    function Card({ title, children }) {
      return (
        <div className="info-card">
          <h3 className="info-title">{title}</h3>
          <div className="info-body">{children}</div>
        </div>
      );
    }

    function StudentInfoCard() {
      return (
        <Card title="Student Info">
          <p>Name: Sunar Roshani</p>
          <p>Major: Computer Engineering</p>
        </Card>
      );
    }

    // User Card
    function UserCard({ name, role }) {
      const initials = name.split(" ").map(w => w[0]).join("");

      return (
        <div className="user-card">
          <div className="initials">{initials}</div>
          <h3>{name}</h3>
          <p>{role}</p>
          <p>Joined: {new Date().getFullYear()}</p>
        </div>
      );
    }

    // Profile Card with default prop
    function ProfileCard({
      name,
      role,
      email,
      avatarUrl = DEFAULT_AVATAR
    }) {
      return (
        <div className="profile-card">
          <img
            className="avatar-img"
            src={avatarUrl}
            alt={name}
          />
          <h3>{name}</h3>
          <p>{role}</p>
          <a href={`mailto:${email}`}>{email}</a>
        </div>
      );
    }

    function App() {
      return (
        <div>

          <nav>
            <a href="#first">1. First Component</a>
            <a href="#student-card">2. StudentCard</a>
            <a href="#product">3. Product Card</a>
            <a href="#students">4. Student List</a>
            <a href="#notifications">5. Notifications</a>
            <a href="#conditional">6. Conditional Rendering</a>
            <a href="#children">7. Card Children</a>
            <a href="#profile">8. Profile Cards</a>
            <a href="#users">User Cards</a>
            <a href="#avatar">Default Prop</a>
          </nav>

          <section id="first">
            <h2>1. First Component</h2>
            <p className="desc">
              Creating one reusable component and displaying it three times.
            </p>

            <div className="row">
              <WelcomeCard message="Welcome to React!" />
              <WelcomeCard message="Learning Components" />
              <WelcomeCard message="Learning Props" />
            </div>
          </section>

          <section id="student-card">
            <h2>2. StudentCard with Props</h2>
            <p className="desc">
              Passing name, student ID and major to a reusable component.
            </p>

            <div className="row">
              <StudentCard
                name="Roshani Sunar"
                id="202537197"
                major="Computer Engineering"
              />
              <StudentCard
                name="Aale Aaditi"
                id="202537195"
                major="Computer Engineering"
              />
              <StudentCard
                name="Shrestha Puja"
                id="202537250"
                major="Computer Engineering"
              />
            </div>
          </section>

          <section id="product">
            <h2>3. Product Card</h2>
            <p className="desc">
              Props: name, price, rating and inStock.
            </p>

            <div className="row">
              <ProductCard
                name="Wireless Earbuds"
                price={89000}
                rating={4.5}
                inStock={true}
              />

              <ProductCard
                name="Smart Watch"
                price={159000}
                rating={4}
                inStock={false}
              />

              <ProductCard
                name="USB-C Hub"
                price={45000}
                rating={4.8}
                inStock={true}
              />
            </div>
          </section>

          <section id="students">
            <h2>4. Student List</h2>
            <p className="desc">
              Rendering a list with .map() and a unique key for each item.
            </p>

            <StudentList />
          </section>

          <section id="notifications">
            <h2>5. Notification List</h2>
            <p className="desc">
              Using .map(), unique keys and conditional icons.
            </p>

            <NotificationList />
          </section>

          <section id="conditional">
            <h2>6. Conditional Rendering</h2>
            <p className="desc">
              Uses return null, a ternary operator and the && operator.
            </p>

            <ConditionalDemo />
          </section>

          <section id="children">
            <h2>7. Card with props.children</h2>
            <p className="desc">
              A reusable Card component that displays different content.
            </p>

            <div className="row">
              <StudentInfoCard />

              <Card title="Lecture Topics">
                <p>Components</p>
                <p>Props</p>
                <p>Conditional Rendering</p>
              </Card>

              <Card title="Homework">
                <p>Build a student portfolio component.</p>
                <p>Practice using React props.</p>
              </Card>

              <Card title="Course">
                <p>Web Programming</p>
                <p>Week 11: React Props</p>
              </Card>
            </div>
          </section>

          <section id="profile">
            <h2>8. Profile Card (Props)</h2>
            <p className="desc">
              Passing strings, numbers and booleans as props.
            </p>

            <div className="row">
              <ProfileBadge
                name="Lama Srijan"
                role="Frontend Developer"
                followers={1240}
                isVerified={true}
              />

              <ProfileBadge
                name="Sunar Roshani"
                role="Computer Engineering Student"
                followers={350}
                isVerified={false}
              />
            </div>
          </section>

          <section id="users">
            <h2>9. User Cards</h2>
            <p className="desc">
              Creating multiple user cards using .map().
            </p>

            <div className="row">
              {students.map(student => (
                <UserCard
                  key={student.id}
                  name={student.name}
                  role={student.major + " student"}
                />
              ))}
            </div>
          </section>

          <section id="avatar">
            <h2>10. Profile Card with a Default Prop</h2>
            <p className="desc">
              avatarUrl has a default value when no image is provided.
            </p>

            <div className="row">
              <ProfileCard
                name="Dr. Toshpulatov"
                role="Professor"
                email="muhiddin@gachon.ac.kr"
              />

              <ProfileCard
                name="Roshani Sunar"
                role="Computer Engineering student"
                email="roshni123sunar0@gmail.com"
              />
            </div>
          </section>

        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);

  </script>
</body>
</html>
