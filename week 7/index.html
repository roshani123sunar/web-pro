

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #222;
            margin: 0;
            padding: 30px 15px;
        }

        form {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #2457a7;
        }

        fieldset {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
            color: #2457a7;
            padding: 0 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input:not([type="checkbox"]):not([type="range"]),
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 2px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: blue;
        }

        input:valid:not(:focus):not(:placeholder-shown),
        select:valid:not(:focus) {
            border-color: green;
        }

        input:invalid:not(:focus):not(:placeholder-shown),
        select:invalid:not(:focus) {
            border-color: red;
        }

        input[type="date"]:valid,
        input[type="checkbox"]:valid {
            accent-color: green;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
        }

        .terms input {
            width: auto;
            margin: 0;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 12px;
            accent-color: #2457a7;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background-color: #2457a7;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163c78;
        }

        button[type="reset"] {
            background-color: #555;
        }
    </style>
</head>

<body>

    <form action="#" method="post">
        <h1>Student Registration Form</h1>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="studentid">Student ID (9 digits):</label>
            <input
                type="text"
                id="studentid"
                name="studentid"
                placeholder="123456789"
                pattern="[0-9]{9}"
                maxlength="9"
                inputmode="numeric"
                title="Enter exactly 9 digits"
                required
            >

            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

            <label for="major">Major:</label>
            <select id="major" name="major" required>
                <option value="">-- Select your major --</option>
                <option value="computer-engineering">Computer Engineering</option>
                <option value="business">Business Administration</option>
                <option value="electrical-engineering">Electrical Engineering</option>
                <option value="design">Design</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Account Information</legend>

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 8 characters"
                minlength="8"
                required
            >

            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="010-1234-5678"
                pattern="010-[0-9]{4}-[0-9]{4}"
                title="Enter phone number as 010-1234-5678"
                required
            >
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="experience">
                Coding Experience:
                <span id="level">5</span>/10
            </label>

            <input
                type="range"
                id="experience"
                name="experience"
                min="0"
                max="10"
                value="5"
                oninput="document.getElementById('level').textContent = this.value"
            >

            <label class="terms" for="terms">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >
                I agree to the terms and conditions.
            </label>
        </fieldset>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>
    </form>

</body>
</html>
